<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Sobre Nosotros - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-secondary mb-3">Volver al Dashboard</a>
        <h3>Propuesta de Valor / Sobre Nosotros</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título Principal</label>
                        <input class="form-control" type="text" name="titulo" value="{{ nosotros.titulo }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción / Historia</label>
                        <textarea class="form-control" name="descripcion" rows="5" required>{{ nosotros.descripcion }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Visión o Misión (Texto destacado)</label>
                        <textarea class="form-control" name="mision" rows="3">{{ nosotros.mision }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
