<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Artículo - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="{{ url_for('content.editar_blog') }}" class="btn btn-secondary mb-3">Volver al Gestor de Blog</a>
        <h3>Editar Artículo</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input class="form-control" type="text" name="titulo" value="{{ articulo.titulo }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Extracto (Resumen para la landing)</label>
                        <textarea class="form-control" name="extracto" rows="2" required>{{ articulo.extracto }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contenido Completo (Acepta HTML)</label>
                        <textarea class="form-control" name="contenido" rows="10" required>{{ articulo.contenido }}</textarea>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="activo" id="activo"
                               {% if articulo.activo == 1 %}checked{% endif %}>
                        <label class="form-check-label" for="activo">
                            Publicado (desactívalo para guardar como borrador, sin mostrarlo en la landing)
                        </label>
                    </div>
                    <small class="text-muted d-block mb-3">
                        URL pública: <code>/articulo/{{ articulo.id }}</code> — no cambia al editar el título.
                    </small>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
