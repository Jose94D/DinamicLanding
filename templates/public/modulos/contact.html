<section class="py-5 bg-white" id="contact">
    <div class="container" style="max-width: 600px;">
        <h2 class="text-center mb-4">Contáctanos</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('public.enviar_contacto') }}">
            <!-- Campo trampa anti-spam: invisible para personas, los bots lo suelen rellenar -->
            <div style="position: absolute; left: -9999px;" aria-hidden="true">
                <label for="sitio_web">No completar este campo</label>
                <input type="text" id="sitio_web" name="sitio_web" tabindex="-1" autocomplete="off">
            </div>

            <div class="mb-3">
                <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
            </div>
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Tu correo electrónico" required>
            </div>
            <div class="mb-3">
                <textarea name="mensaje" class="form-control" rows="3" placeholder="Tu mensaje" required></textarea>
            </div>
            <button class="btn btn-dark w-100" type="submit">Enviar Mensaje</button>
        </form>
    </div>
</section>
