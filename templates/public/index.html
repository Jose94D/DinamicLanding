<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ seo.meta_titulo if seo else 'Mi Landing Page' }}</title>
    <meta name="description" content="{{ seo.meta_descripcion if seo else '' }}">
    {% if seo and seo.og_image %}
    <meta property="og:image" content="{{ url_for('static', filename='img/' ~ seo.og_image) }}">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    
    <!-- Navbar estático (opcional) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DynamicLanding</a>
        </div>
    </nav>

    <!-- BUCLE MÁGICO: Renderiza los módulos en orden -->
    <main>
        {% for mod in modulos %}
            {% include 'public/modulos/' ~ mod.id ~ '.html' ignore missing %}
        {% endfor %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
