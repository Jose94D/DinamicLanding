<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ articulo.titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar Minimalista -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">← Volver al Inicio</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h1 class="fw-bold mb-3">{{ articulo.titulo }}</h1>
                        <p class="text-muted mb-4 pb-3 border-bottom">Publicado el {{ articulo.fecha_publicacion }}</p>
                        
                        <!-- El filtro |safe permite que se renderice HTML si lo usaste al redactar -->
                        <div class="contenido-articulo text-dark" style="line-height: 1.8;">
                            {{ articulo.contenido | safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
